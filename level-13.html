<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>level 13</title>
    <style>
        body { 
            background-color: #080808; 
            color: #d0d0d0; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            border: 1px solid #222;
            padding: 50px 60px;
            text-align: center;
            background-color: #0c0c0c;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        h1 {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        p.clue {
            font-style: italic;
            color: #777;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }
        
        .hexahue-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 550px;
            margin: 0 auto;
        }

        /* Official Hexahue 2x3 Grid Structure */
        .hex-symbol {
            width: 28px;
            height: 42px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            background-color: #000;
            padding: 2px;
            border: 1px solid #222;
        }

        .k { background-color: #000000; } /* Black */
        .w { background-color: #ffffff; } /* White */
        .r { background-color: #ff0000; } /* Red */
        .g { background-color: #00ff00; } /* Green */
        .b { background-color: #0000ff; } /* Blue */
        .c { background-color: #00ffff; } /* Cyan */
        .m { background-color: #ff00ff; } /* Magenta */
        .y { background-color: #ffff00; } /* Yellow */
    </style>
</head>
<body>
    <div class="box">
        <h1>level 13</h1>
        <p class="clue">read the spectrum. decipher the hexahue.</p>
        
        <div class="hexahue-container">
            <!-- A: Red (Top 4 Red, Bottom 2 Black) -->
            <div class="hex-symbol">
                <div class="r"></div><div class="r"></div>
                <div class="r"></div><div class="r"></div>
                <div class="k"></div><div class="k"></div>
            </div>
            <!-- R: Red (Top-left Red, rest Black/White) -->
            <div class="hex-symbol">
                <div class="r"></div><div class="k"></div>
                <div class="w"></div><div class="w"></div>
                <div class="k"></div><div class="r"></div>
            </div>
            <!-- G: Green (Top 4 Green, Bottom 2 Black) -->
            <div class="hex-symbol">
                <div class="g"></div><div class="g"></div>
                <div class="g"></div><div class="g"></div>
                <div class="k"></div><div class="k"></div>
            </div>
            <!-- U: Yellow (Top-left Yellow, rest pattern) -->
            <div class="hex-symbol">
                <div class="y"></div><div class="k"></div>
                <div class="w"></div><div class="w"></div>
                <div class="k"></div><div class="y"></div>
            </div>
            <!-- M: Magenta (Top-left Magenta) -->
            <div class="hex-symbol">
                <div class="m"></div><div class="k"></div>
                <div class="w"></div><div class="w"></div>
                <div class="k"></div><div class="m"></div>
            </div>
            <!-- E: Cyan (Top 4 Cyan, Bottom 2 Black) -->
            <div class="hex-symbol">
                <div class="c"></div><div class="c"></div>
                <div class="c"></div><div class="c"></div>
                <div class="k"></div><div class="k"></div>
            </div>
            <!-- N: Cyan (Top-left Cyan) -->
            <div class="hex-symbol">
                <div class="c"></div><div class="k"></div>
                <div class="w"></div><div class="w"></div>
                <div class="k"></div><div class="c"></div>
            </div>
            <!-- T: Red (Top-left & Top-right Red) -->
            <div class="hex-symbol">
                <div class="r"></div><div class="r"></div>
                <div class="w"></div><div class="w"></div>
                <div class="k"></div><div class="k"></div>
            </div>
        </div>
    </div>
</body>
</html>
