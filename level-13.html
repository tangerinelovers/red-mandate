<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>level 13</title>
    <style>
        body { 
            background-color: #080808; 
            color: #d0d0d0; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            border: 1px solid #222;
            padding: 50px 60px;
            text-align: center;
            background-color: #0c0c0c;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        h1 {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        p.clue {
            font-style: italic;
            color: #777;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }
        
        .hexahue-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Standard 2x3 Hexahue Grid */
        .hex-symbol {
            width: 32px;
            height: 48px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            border: 1px solid #1a1a1a;
        }

        /* dCode Color Palette */
        .red { background-color: #ff0000; }
        .lime { background-color: #00ff00; }
        .blue { background-color: #0000ff; }
        .yellow { background-color: #ffff00; }
        .cyan { background-color: #00ffff; }
        .magenta { background-color: #ff00ff; }
        .pink { background-color: #ff66cc; }
    </style>
</head>
<body>
    <div class="box">
        <h1>level 13</h1>
        <p class="clue">i love colors</p>
        
        <div class="hexahue-container">
            <!-- b -->
            <div class="hex-symbol">
                <div class="pink"></div><div class="red"></div>
                <div class="lime"></div><div class="yellow"></div>
                <div class="blue"></div><div class="cyan"></div>
            </div>
            <!-- r -->
            <div class="hex-symbol">
                <div class="blue"></div><div class="yellow"></div>
                <div class="cyan"></div><div class="magenta"></div>
                <div class="red"></div><div class="lime"></div>
            </div>
            <!-- o -->
            <div class="hex-symbol">
                <div class="lime"></div><div class="blue"></div>
                <div class="cyan"></div><div class="magenta"></div>
                <div class="yellow"></div><div class="red"></div>
            </div>
            <!-- t -->
            <div class="hex-symbol">
                <div class="blue"></div><div class="cyan"></div>
                <div class="red"></div><div class="lime"></div>
                <div class="yellow"></div><div class="lime"></div>
            </div>
            <!-- h -->
            <div class="hex-symbol">
                <div class="yellow"></div><div class="blue"></div>
                <div class="cyan"></div><div class="red"></div>
                <div class="magenta"></div><div class="red"></div>
            </div>
            <!-- e -->
            <div class="hex-symbol">
                <div class="red"></div><div class="lime"></div>
                <div class="yellow"></div><div class="blue"></div>
                <div class="magenta"></div><div class="cyan"></div>
            </div>
            <!-- r -->
            <div class="hex-symbol">
                <div class="yellow"></div><div class="blue"></div>
                <div class="cyan"></div><div class="lime"></div>
                <div class="magenta"></div><div class="red"></div>
            </div>
            <!-- s -->
            <div class="hex-symbol">
                <div class="magenta"></div><div class="red"></div>
                <div class="yellow"></div><div class="cyan"></div>
                <div class="red"></div><div class="lime"></div>
            </div>
        </div>
    </div>
</body>
</html>
